[project]
name = "trading-analyst"
version = "0.1.0"
description = "Deterministic EOD swing-trading analysis engine with LLM explanations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "yfinance>=0.2.36",
    "pyarrow>=15.0.0",
    "ta-lib>=0.4.28; sys_platform != 'win32'",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "openai>=1.14.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that fetch live market data",
]
